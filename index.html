<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
<style>
/* REPLACE everything currently in here with this new CSS block: */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: #2C2F38;
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
.clock-card {
  background: #2C2F38;
  text-align: center;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3%;
}
svg {
  width: auto;
  height: 60%;
  max-width: 90%;
}
#digital-time {
  color: #FFAB91;
  font-size: clamp(0.7rem, 4vw, 1rem);
  font-weight: 700;
  letter-spacing: 1px;
  margin-top: 10px;
}
#date-label {
  color: #FFAB91;
  font-size: clamp(0.6rem, 3vw, 0.85rem);
  margin-top: 2px;
}
.num {
  fill: #FFAB91;
  font-size: 10px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
}
</style>
</head>
<body>
  <div class="clock-card">
    <svg width="180" height="180" viewBox="0 0 200 200">
 <circle cx="100" cy="100" r="94" fill="#2C2F38" stroke="#FFAB91" stroke-width="3"/>

      <!-- tick marks -->
      <g id="ticks" stroke="#FFAB91" stroke-width="1"></g>

      <!-- hour numerals -->
      <text class="num" x="100" y="24">12</text>
      <text class="num" x="176" y="102">3</text>
      <text class="num" x="100" y="180">6</text>
      <text class="num" x="24" y="102">9</text>

      <!-- hands, drawn last so they sit on top -->
      <line id="hour-hand" x1="100" y1="100" x2="100" y2="100" stroke="#FFAB91" stroke-width="6" stroke-linecap="round"/>
      <line id="minute-hand" x1="100" y1="100" x2="100" y2="100" stroke="#FFAB91" stroke-width="4" stroke-linecap="round"/>
      <line id="second-hand" x1="100" y1="100" x2="100" y2="100" stroke="#7E7EA5" stroke-width="2" stroke-linecap="round"/>

      <circle cx="100" cy="100" r="5" fill="#7E7EA5"/>
    </svg>

    <div id="digital-time"></div>
    <div id="date-label"></div>
  </div>

  <script>
    const ticks = document.getElementById('ticks');
    for (let i = 0; i < 60; i++) {
      const isHour = i % 5 === 0;
      const angle = (i * 6) * Math.PI / 180;
      const outer = 88;
      const inner = isHour ? 78 : 84;
      const x1 = 100 + inner * Math.sin(angle);
      const y1 = 100 - inner * Math.cos(angle);
      const x2 = 100 + outer * Math.sin(angle);
      const y2 = 100 - outer * Math.cos(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke-width', isHour ? 2.5 : 1);
      ticks.appendChild(line);
    }

    function setHand(id, angleDeg, length) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      const x2 = 100 + length * Math.cos(rad);
      const y2 = 100 + length * Math.sin(rad);
      const hand = document.getElementById(id);
      hand.setAttribute('x2', x2);
      hand.setAttribute('y2', y2);
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      setHand('hour-hand', hours * 30 + minutes * 0.5, 42);
      setHand('minute-hand', minutes * 6 + seconds * 0.1, 62);
      setHand('second-hand', seconds * 6, 72);

      document.getElementById('digital-time').textContent = now.toLocaleTimeString('en-AU', {
        hour: '2-digit', minute: '2-digit', hour12: true
      });
      document.getElementById('date-label').textContent = now.toLocaleDateString('en-AU', {
        weekday: 'long', day: 'numeric', month: 'short'
      });
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
